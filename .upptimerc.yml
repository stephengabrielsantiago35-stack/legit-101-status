  customHeadHtml: "<style>:root{--body-background-color:#0a0a0a;--body-text-color:#ffffff;--card-background-color:#111111;--card-border-color:#222222;--nav-background-color:#0a0a0a;--nav-border-bottom-color:#e8e34d;--nav-current-border-bottom-color:#e8e34d;--down-border-left-color:#ef4444;--down-background-color:#1a0505;--degraded-border-left-color:#e8e34d;--up-border-left-color:#22c55e;--tag-color:#0a0a0a;--tag-up-background-color:#22c55e;--tag-down-background-color:#ef4444;--tag-degraded-background-color:#e8e34d;--change-background-color:#e8e34d;--error-button-border-color:#e8e34d;--error-button-background-color:#e8e34d;--error-button-color:#0a0a0a;--submit-button-border-color:#e8e34d;--submit-button-background-color:#e8e34d;--submit-button-color:#0a0a0a;--accent-color:#e8e34d;--graph-opacity:1;--graph-filter:none}body{background:#0a0a0a!important;color:#fff!important;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}nav{background:#0a0a0a!important;border-bottom:2px solid #e8e34d!important}nav a{color:#fff!important}[aria-current]{border-bottom-color:#e8e34d!important}h1,h2,h3,h4,h5,h6{color:#e8e34d!important}a{color:#e8e34d!important}article{background:#111111!important;border-color:#222222!important}article.up{border-left-color:#22c55e!important}article.down{border-left-color:#ef4444!important}article.degraded{border-left-color:#e8e34d!important}.tag.up{background:#22c55e!important;color:#000!important}.tag.down{background:#ef4444!important;color:#fff!important}.tag.degraded{background:#e8e34d!important;color:#000!important}.submit-button{background:#e8e34d!important;color:#0a0a0a!important;border-color:#e8e34d!important}a.error-button{border-color:#e8e34d!important;background:#e8e34d!important;color:#0a0a0a!important}.changed+section .data{background:#1a1a1a}footer{border-top:1px solid #222222;color:#666}footer a{color:#e8e34d!important}</style>
