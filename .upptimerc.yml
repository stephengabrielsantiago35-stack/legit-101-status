status-website:
  baseUrl: /legit-101-status
  name: Legit 101 DXB
  introTitle: "**Legit 101 DXB** - System Status"
  introMessage: Real-time uptime monitoring for all Legit 101 DXB services.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://legit101dxb.com
    - title: GitHub
      href: https://github.com/stephengabrielsantiago35-stack/legit-101-status
  theme: dark
  css: |
    :root {
      --body-background-color: #0a0a0a;
      --body-text-color: #ffffff;
      --card-background-color: #111111;
      --card-border-color: #222222;
      --nav-background-color: #0a0a0a;
      --nav-border-bottom-color: #e8e34d;
      --status-up-color: #22c55e;
      --status-down-color: #ef4444;
      --status-degraded-color: #e8e34d;
      --accent-color: #e8e34d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0a0a !important;
      color: #ffffff !important;
    }
    h1, h2, h3 { color: #e8e34d !important; }
    a { color: #e8e34d !important; }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #222222; }
    th {
      background-color: #111111; color: #e8e34d;
      font-weight: 600; text-transform: uppercase;
      font-size: 0.75rem; letter-spacing: 0.05em;
    }
    td { background-color: #111111; }
    tr:hover td { background-color: #1a1a1a; }
    nav {
      background-color: #0a0a0a !important;
      border-bottom: 2px solid #e8e34d !important;
    }
    nav a { color: #ffffff !important; }
    nav a:hover { color: #e8e34d !important; }
    footer {
      border-top: 1px solid #222222;
      padding-top: 1.5rem;
      margin-top: 3rem;
      color: #666666;
      font-size: 0.85rem;
    }
